name: APK Builder Worker

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Target GitHub Repo URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      package_name:
        description: 'Package Name'
        required: true
      build_id:
        description: 'Unique Build ID'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04   # PINNED: noble is the Ubuntu we test the package list against
    timeout-minutes: 25     # MUST match WORKFLOW_TIMEOUT_MIN in app.py

    steps:
      - name: Clone Target Repo (Depth 1)
        run: git clone --depth 1 ${{ github.event.inputs.repo_url }} source

      - name: Validate Project Structure (fail fast)
        run: |
          cd source
          if [ ! -f main.py ] && [ ! -f buildozer.spec ]; then
            echo "::error::Not a Buildozer-compatible project: no main.py and no buildozer.spec found"
            exit 1
          fi
          echo "Project structure OK"

      - name: Reject Flet projects (typed, fast)
        run: |
          cd source
          if grep -qE "^(import|from)[[:space:]]+flet" main.py 2>/dev/null || grep -qi "^flet" requirements.txt 2>/dev/null; then
            echo "::error::Flet detected. Flet apps must be built with 'flet build apk', not Buildozer. Kivy/KivyMD only for now."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Pre-accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Buildozer & System Dependencies
        run: |
          sudo apt-get update
          # Ubuntu 24.04 (noble) removed libtinfo5 (ships libtinfo6, preinstalled) - deliberately absent
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          # noble's system Python is PEP 668 externally-managed; safe on an ephemeral runner
          pip3 install --break-system-packages buildozer==1.6.0 cython==0.29.33

      - name: Patch buildozer.spec (Strict Algorithm)
        run: |
          cd source
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          cat << 'EOF' > patch.py
          import re, sys
          # Keys we OWN and overwrite in [app] (spec section 5)
          PATCH_KEYS = {
              "title":          re.compile(r"^(\s*)title(\s*=\s*).*$"),
              "package.name":   re.compile(r"^(\s*)package\.name(\s*=\s*).*$"),
              "package.domain": re.compile(r"^(\s*)package\.domain(\s*=\s*).*$"),
          }
          # Keys we only ENSURE exist in [app] (insert default if absent; NEVER overwrite)
          ENSURE_KEYS = {
              "requirements": ("python3,kivy", re.compile(r"^(\s*)requirements(\s*=\s*).*$")),
          }
          # CI-environment keys we FORCE in [buildozer]: an author's local SDK path can never
          # exist on an ephemeral runner, so overriding it is the only correct behavior here.
          FORCE_BUILDOZER_KEYS = {
              "android.sdk_path": "/usr/local/lib/android/sdk",
          }

          def set_buildozer_keys(lines, values):
              for key, value in values.items():
                  pat = re.compile(r"^(\s*)" + re.escape(key) + r"(\s*=\s*).*$")
                  replaced = False
                  for i, l in enumerate(lines):
                      if l.lstrip().startswith("#"): continue
                      m = pat.match(l)
                      if m:
                          lines[i] = f"{m.group(1)}{key}{m.group(2)}{value}\n"
                          replaced = True
                  if not replaced:
                      idx = None
                      for i, l in enumerate(lines):
                          if l.strip() == "[buildozer]":
                              idx = i
                      if idx is not None:
                          lines.insert(idx + 1, f"{key} = {value}\n")
                      else:
                          lines.extend(["\n[buildozer]\n", f"{key} = {value}\n"])
              return lines

          def patch_spec(text, title, package_name):
              domain, _, name = package_name.rpartition(".")
              values = {"title": title, "package.name": name, "package.domain": domain}
              lines = text.splitlines(keepends=True)
              found = set()
              for i, line in enumerate(lines):
                  if line.lstrip().startswith("#"): continue
                  for key, pat in PATCH_KEYS.items():
                      if key in found: continue
                      m = pat.match(line)
                      if m:
                          lines[i] = f"{m.group(1)}{key}{m.group(2)}{values[key]}\n"
                          found.add(key)
              for key, (_, pat) in ENSURE_KEYS.items():
                  for line in lines:
                      if line.lstrip().startswith("#"): continue
                      if pat.match(line):
                          found.add(key)
                          break
              missing = (set(PATCH_KEYS) | set(ENSURE_KEYS)) - found
              if missing:
                  allvals = dict(values)
                  allvals.update({k: v for k, (v, _) in ENSURE_KEYS.items()})
                  for i, line in enumerate(lines):
                      if line.strip() == "[app]":
                          at = i + 1
                          for key in sorted(missing):
                              lines.insert(at, f"{key} = {allvals[key]}\n")
                              at += 1
                          break
              lines = set_buildozer_keys(lines, FORCE_BUILDOZER_KEYS)
              return "".join(lines)

          with open('buildozer.spec', 'r') as f: text = f.read()
          patched = patch_spec(text, sys.argv[1], sys.argv[2])
          with open('buildozer.spec', 'w') as f: f.write(patched)
          EOF
          python3 patch.py "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_name }}"

      - name: Execute Buildozer
        run: |
          cd source
          buildozer -v android debug

      - name: Package APK Artifact
        run: |
          cd source
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found after build success"
            exit 1
          fi
          mkdir -p artifacts
          cp $APK_PATH artifacts/app-${{ github.event.inputs.build_id }}.apk

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_id }}
          path: source/artifacts/*.apk
          retention-days: 1
