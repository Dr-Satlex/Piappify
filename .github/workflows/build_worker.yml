name: APK Builder Worker

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Target GitHub Repo URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      package_name:
        description: 'Package Name'
        required: true
      build_id:
        description: 'Unique Build ID'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Clone Target Repo (Depth 1)
        run: git clone --depth 1 ${{ github.event.inputs.repo_url }} source

      - name: Validate Project Structure (fail fast)
        run: |
          cd source
          if [ ! -f main.py ] && [ ! -f buildozer.spec ]; then
            echo "::error::Not a Buildozer-compatible project: no main.py and no buildozer.spec found"
            exit 1
          fi
          echo "Project structure OK"

      - name: Reject Flet projects (typed, fast)
        run: |
          cd source
          if grep -qE "^(import|from)[[:space:]]+flet" main.py 2>/dev/null || grep -qi "^flet" requirements.txt 2>/dev/null; then
            echo "::error::Flet detected. Flet apps must be built with 'flet build apk', not Buildozer. Kivy/KivyMD only for now."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install libtinfo5 (needed by Buildozer's Android toolchain)
        run: |
          set -euo pipefail
          BASE="https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses"
          DEB=$(curl -fsSL "$BASE/" | grep -oE 'libtinfo5_[^"]+_amd64\.deb' | sort -V | tail -n1)
          if [ -z "$DEB" ]; then
            echo "::error::Could not resolve a libtinfo5 .deb from $BASE"
            exit 1
          fi
          echo "Resolved package: $DEB"
          wget -q "$BASE/$DEB"
          sudo apt-get install -y "./$DEB"

      - name: Install Buildozer & System Dependencies
        run: |
          sudo apt-get update
          # Added libltdl-dev, libtool-bin, automake, autopoint, gettext to fix
          # the 'possibly undefined macro: LT_SYS_SYMBOL_USCORE' error during
          # the libffi recipe's autoreconf step.
          sudo apt-get install -y git zip unzip python3-pip python3-dev python3-virtualenv python3-setuptools \
            build-essential autoconf libtool libtool-bin pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev automake autopoint gettext libltdl-dev
          
          # Cython 0.29.34 is recommended for modern p4a/kivy builds.
          pip3 install --break-system-packages buildozer==1.6.0 cython==0.29.34

      - name: Patch buildozer.spec (Strict Algorithm)
        run: |
          cd source
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          cat << 'EOF' > patch.py
          import re, sys

          PATCH_KEYS = {
              "title":          re.compile(r"^(\s*)title(\s*=\s*).*$"),
              "package.name":   re.compile(r"^(\s*)package\.name(\s*=\s*).*$"),
              "package.domain": re.compile(r"^(\s*)package\.domain(\s*=\s*).*$"),
              "android.accept_sdk_license": re.compile(r"^(\s*)android\.accept_sdk_license(\s*=\s*).*$"),
              "p4a.branch":     re.compile(r"^(\s*)p4a\.branch(\s*=\s*).*$"),
          }
          ENSURE_KEYS = {
              "requirements": ("python3,kivy", re.compile(r"^(\s*)requirements(\s*=\s*).*$")),
              "android.accept_sdk_license": ("True", re.compile(r"^(\s*)android\.accept_sdk_license(\s*=\s*).*$")),
              "p4a.branch": ("develop", re.compile(r"^(\s*)p4a\.branch(\s*=\s*).*$")),
          }

          def patch_spec(text, title, package_name):
              domain, _, name = package_name.rpartition(".")
              values = {
                  "title": title,
                  "package.name": name,
                  "package.domain": domain,
                  "android.accept_sdk_license": "True",
                  "p4a.branch": "develop", # Forces the fix for Python 3.14 venv corruption
              }
              lines = text.splitlines(keepends=True)
              found = set()
              for i, line in enumerate(lines):
                  if line.lstrip().startswith("#"):
                      continue
                  for key, pat in PATCH_KEYS.items():
                      m = pat.match(line)
                      if m:
                          lines[i] = f"{m.group(1)}{key}{m.group(2)}{values[key]}\n"
                          found.add(key)
              for key, (_, pat) in ENSURE_KEYS.items():
                  for line in lines:
                      if line.lstrip().startswith("#"):
                          continue
                      if pat.match(line):
                          found.add(key)
                          break
              missing = (set(PATCH_KEYS) | set(ENSURE_KEYS)) - found
              if missing:
                  allvals = dict(values)
                  allvals.update({k: v for k, (v, _) in ENSURE_KEYS.items()})
                  for i, line in enumerate(lines):
                      if line.strip() == "[app]":
                          at = i + 1
                          for key in sorted(missing):
                              lines.insert(at, f"{key} = {allvals[key]}\n")
                              at += 1
                          break
              return "".join(lines)

          with open('buildozer.spec', 'r') as f:
              text = f.read()
          patched = patch_spec(text, sys.argv[1], sys.argv[2])
          with open('buildozer.spec', 'w') as f:
              f.write(patched)
          EOF
          python3 patch.py "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_name }}"

      - name: Execute Buildozer
        run: |
          cd source
          # 'yes |' auto-answers sdkmanager license prompts.
          # tee saves the log for the failure excerpt below.
          yes | buildozer -v android debug 2>&1 | tee build.log
          status=${PIPESTATUS[1]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Buildozer failed with exit code $status - error excerpt:"
            grep -nE "Traceback|Command failed|error:|Exception|stderr" build.log | tail -n 30 || true
            echo "--- last 60 lines of build.log ---"
            tail -n 60 build.log
            exit "$status"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.build_id }}
          path: source/build.log
          retention-days: 7

      - name: Package APK Artifact
        run: |
          cd source
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found after build success"
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK_PATH" "artifacts/app-${{ github.event.inputs.build_id }}.apk"

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_id }}
          path: source/artifacts/*.apk
          retention-days: 1
